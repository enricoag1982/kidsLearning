count-up:
  title: Counting with Fox
  story: Fox loves counting apples. Count them one by one, and the last number tells you how many.
  demo: Fox found three apples. One, two, three!
count-g1: Are there two apples?
count-g2: Which shape is the odd one out?
count-g3: Which shape fills the gap?
count-01: How many apples are there?
count-01-opt-c: Five
count-01-reason-c: A hand is five fingers. Count the apples!
count-02: Is this true?
count-02-reason: Two and two make four, not five.
count-03: What is seven plus five?
count-03-reason-times: That is seven times five. This one is plus!
count-04: Put the numbers in order, smallest first.
count-04-two: Two
parade:
  title: Number Parade
  goal: Get every card right. How few mistakes can you make?
parade-r1: What is nine minus four?
parade-r2: Put the letters in order.
parade-r3: Is this a fox?
take-away:
  title: Take Away
  goal: Take 1 or 2 stones. Whoever takes the last stone wins!
take-away-hint: Leave me a pile of 3.
bugs:
  off-by-one: So close! Count the last jump again.
templates:
  fixture-add: What is {{a}} plus {{b}}?
