id: sort-up
order: 1
concept: sorting
character: fox
demo:
  prompt:
    shapes:
      - { kind: circle, colour: red }
      - { kind: square, colour: blue }
guided: []
exercises:
  # row: two boxes by colour (box rules over the shapes' facts).
  - id: sort-01
    type: group
    layout: row
    boxes:
      - { id: red, text: sort-red, rule: { all: ['colour:red'] } }
      - { id: blue, text: sort-blue, rule: { all: ['colour:blue'] } }
    items:
      - { id: r-circle, shape: { kind: circle, colour: red } }
      - { id: b-square, shape: { kind: square, colour: blue } }
      - { id: r-triangle, shape: { kind: triangle, colour: red } }
      - { id: b-star, shape: { kind: star, colour: blue } }
    answer: { r-circle: red, b-square: blue, r-triangle: red, b-star: blue }
  # carroll: colour (columns) x kind (rows), one card in each cell.
  - id: sort-02
    type: group
    layout: carroll
    axes:
      - { text: sort-red, notText: sort-not-red, rule: { all: ['colour:red'] } }
      - { text: sort-circle, notText: sort-not-circle, rule: { all: ['kind:circle'] } }
    items:
      - { id: r-circle, shape: { kind: circle, colour: red } }
      - { id: r-square, shape: { kind: square, colour: red } }
      - { id: b-circle, shape: { kind: circle, colour: blue } }
      - { id: y-triangle, shape: { kind: triangle, colour: yellow } }
    answer:
      r-circle: a-b
      r-square: a-not-b
      b-circle: not-a-b
      y-triangle: not-a-not-b
  # venn: square and blue as the two circles, one card in each region (one outside both).
  - id: sort-03
    type: group
    layout: venn
    axes:
      - { text: sort-square, notText: sort-not-square, rule: { all: ['kind:square'] } }
      - { text: sort-blue, notText: sort-not-blue, rule: { all: ['colour:blue'] } }
    items:
      - { id: b-square, shape: { kind: square, colour: blue } }
      - { id: r-square, shape: { kind: square, colour: red } }
      - { id: b-triangle, shape: { kind: triangle, colour: blue } }
      - { id: y-circle, shape: { kind: circle, colour: yellow } }
    answer: { b-square: both, r-square: only-a, b-triangle: only-b, y-circle: neither }
