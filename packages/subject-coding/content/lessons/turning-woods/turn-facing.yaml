    type: choice
    text: ask-facing-e1
    prompt: { emoji: 🦊, big: '←' }
    options:
      - { id: up, big: '↑' }
      - { id: right, big: '→' }
      - { id: down, big: '↓' }
      - { id: left, big: '←' }
    answer: up
