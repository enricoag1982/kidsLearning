# W1 lesson 2: one arrow = one step, read left to right. Maps: S start, F flag, * star, # rock, . empty. No rocks or stars yet.
# `cap` = the solution's length + 2 (every solution here is a shortest one). Texts: `ask-*` in locales/en/lessons.yaml.
id: seq-arrows
order: 2
concept: seq-arrows
character: fox
demo:
  prompt: { big: '→ → ↓' }
guided:
  - id: arrows-g1
    type: program
    text: ask-reach-guided
    map: ['S..', '.F.', '...']
    tray: [right, down]
    cap: 4
    solution: [right, down]
  - id: arrows-g2
    type: predict
    text: ask-predict
    map: ['...', 'S..', '..F']
    program: [right, down]
exercises:
  - id: arrows-01
    type: program
    text: ask-reach
    map: ['S..', '...', '.F.']
    tray: [up, down, left, right]
    cap: 5
    solution: [down, down, right]
  - id: arrows-02
    type: program
    text: ask-reach
    map: ['....', '.F..', '....', '...S']
    tray: [up, down, left, right]
    cap: 6
    solution: [up, up, left, left]
  - id: arrows-03
    type: program
    text: ask-reach
    map: ['..F.', '....', '....', 'S...']
    tray: [up, down, left, right]
    cap: 7
    solution: [up, up, up, right, right]
  - id: arrows-04
    type: program
    text: ask-reach
    easier: arrows-e1
    map: ['....S', '.....', '.....', '..F..', '.....']
    tray: [up, down, left, right]
    cap: 7
    solution: [down, down, down, left, left]
  - id: arrows-05
    type: predict
    text: ask-predict
    map: ['S...', '....', '...F']
    program: [down, right, right]
  - id: arrows-06
    type: predict
    text: ask-predict
    map: ['....', '.S..', '....', '...F']
    program: [right, down, down, right]
variants:
