# Fixture boss (m12.3): a `series` over coding exercises, replaced by Bug Squash in m12.5. It opens after the last lesson of its world.
id: fixture-boss
mode: series
concept: seq-arrows
unlockAfter: seq-arrows
errors3: 0
errors2: 2
rounds:
  - id: fixture-r1
    type: find-bug
    map: ['S..*', '.#..', '...F']
    program: [right, right, right, down, left]
    bug: [4]
    fix: down
  - id: fixture-r2
    type: program
    map: ['S....F']
    tray: [right, repeat]
    cap: 3
    solution: [{ repeat: 5, do: [right] }]
    must-loop: true
