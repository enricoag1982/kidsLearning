# Generic conditions only. Name / condition texts live in locales/en/rewards.yaml under `badges.<id>.name` / `.condition`.
# Bug Squasher = the `minigame-won` condition on Bug Squash (a win from the Journey boss node or from Play).
badges:
  - id: first-program
    category: milestone
    condition: { type: concept-correct, concept: seq-arrows, thresholds: [1] }
  - id: bug-squasher
    category: skill
    condition: { type: minigame-won, scope: 'minigame:bug-squash', thresholds: [1] }
  - id: meadow-walker
    category: milestone
    condition: { type: mastered, scope: 'world:meadow-steps', thresholds: [1] }
  - id: hill-climber
    category: milestone
    condition: { type: mastered, scope: 'world:looping-hills', thresholds: [1] }
  - id: woods-ranger
    category: milestone
    condition: { type: mastered, scope: 'world:turning-woods', thresholds: [1] }
