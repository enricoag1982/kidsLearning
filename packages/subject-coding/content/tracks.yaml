# One main track, "Coding Basics". Worlds without a lesson show as "Coming soon" on the Journey: Looping Hills and Turning Woods
# get their lessons in m12.6. `title` / habitat names are texts in locales/en/journey.yaml.
tracks:
  - id: basics
    kind: main
    title: tracks.basics
    worlds:
      - {
          id: meadow-steps,
          order: 1,
          habitat: meadow,
          title: worlds.meadow-steps,
          boss: bug-squash,
        }
      - {
          id: looping-hills,
          order: 2,
          habitat: river,
          title: worlds.looping-hills,
          boss: fence-builder,
        }
      - { id: turning-woods, order: 3, habitat: forest, title: worlds.turning-woods }
# A rank is earned `after` a world (`world:<id>`) or at the `start`; its name is in locales/en/journey.yaml.
ranks:
  - { id: starter, after: start }
  - { id: stepper, after: world:meadow-steps }
  - { id: looper, after: world:looping-hills }
