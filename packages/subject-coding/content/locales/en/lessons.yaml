ask-reach: Help Fox reach the flag.
ask-reach-guided: Help Fox reach the flag. Tap the arrows, then press Run.
ask-star: Collect the star, then go to the flag.
ask-stars: Collect the stars, then go to the flag.
ask-predict: Where will Fox stop? Tap the square.
ask-bug: One arrow is wrong. Tap it!
ask-bug-guided: Press Watch. One arrow is wrong. Tap it!
ask-fix: Swap the wrong arrow for the right one, then Run.
ask-same: Which repeat makes the same walk?
ask-same-guided: Which repeat makes the same walk? Tap it!
ask-repeat-first: Reach the flag! Tap Repeat, an arrow, then the number.
ask-reach-loop: Help Fox reach the flag. Use Repeat!
ask-star-loop: Collect the star, then go to the flag. Use Repeat!
ask-stars-loop: Collect the stars, then go to the flag. Use Repeat!
ask-bug-tile: One tile is wrong. Tap it!
ask-bug-tile-guided: Press Watch. One tile is wrong. Tap it!
ask-fence: Use Repeat to collect the stars and reach the flag.
ask-facing-g1: Fox faces up. Turn right. Which way now?
ask-facing-g2: Fox faces up. Turn right, turn right. Which way now?
ask-facing-01: Fox faces right. Turn left. Which way now?
ask-facing-02: Fox faces down. Turn right, turn right, turn right. Which way now?
ask-facing-03: Fox faces left. Turn right, turn left, turn left. Which way now?
ask-facing-e1: Fox faces left. Turn right. Which way now?
ask-turn-guided: Help Fox reach the flag. Tap the tiles, then press Run.
ask-jump-guided: Help Fox reach the flag. Jump over the rocks!
ask-fix-tile: Swap the wrong tile for the right one, then Run.
bug-squash:
  title: Bug Squash
  goal: Find the wrong arrow in every program. How few mistakes can you make?
fence-builder:
  title: Fence Builder
  goal: Build every fence with a Repeat. Stars are the fence posts! How few mistakes can you make?
left-right-rescue:
  title: Left-Right Rescue
  goal: Fox's left and right! Collect every star, then reach the flag. How few mistakes can you make?
