# Lesson and mini-game texts: `<id>.title`, `<id>.story`, `<id>.demo` for a lesson, `<id>.title` / `<id>.goal` for a mini-game, and the
# texts exercises name with `text:` (the question the child hears and reads; one sentence is shared by every exercise that asks it).
# Card labels (`card-*`) are shown under a picture card's emoji and are not narrated.
seq-order:
  title: Steps in order
  story: >-
    Owl says: a program is a list of steps. The steps must be in the right order.
    Fox puts on socks first, then shoes!
  demo: 'Look: first the socks, then the shoes. Shoes first would be silly!'
seq-arrows:
  title: Walk the path
  story: >-
    Owl says: Fox follows arrows, one arrow for each step. Read them from left to right.
    Up goes towards the top of the screen!
  demo: 'Read the arrows from left to right: right, right, down. One arrow is one step.'
seq-collect:
  title: Collect the stars
  story: >-
    Owl says: rocks block Fox's way, so plan a path around them. Fox picks up a star by
    stepping on it. Collect every star, then reach the flag!
  demo: Fox steps on the star to pick it up. Then Fox goes to the flag.
seq-debug:
  title: Bug hunt
  story: >-
    Owl says: a bug is one wrong step in a program. Watch Fox, find the wrong step and fix it.
    Even Fox makes bugs, and that is okay!
  demo: A bug is one wrong step. Find it, fix it, and the program works!
loop-pattern:
  title: See the pattern
  story: >-
    Owl says: look for a pattern, the same steps again and again. A Repeat block does them
    again for you. Put an arrow inside it, then tap the number to say how many times!
  demo: Four arrows the same? One Repeat says it shorter. Repeat four times, right!
loop-repeat:
  title: Repeat N
  story: >-
    Owl says: Repeat does the same step again and again. Pick the step, then tap the number.
    Count the squares Fox must cross to know the number!
  demo: Fox must cross five squares to the right. So the Repeat says five times, right!
loop-chunk:
  title: Repeat a chunk
  story: >-
    Owl says: a Repeat can hold more than one tile. Fox does all of them, then does them
    all again. Look for the steps that come back again and again!
  demo: Right, up, right, up, right, up. That is Repeat three times, right and up!
loop-debug:
  title: Loop bugs
  story: >-
    Owl says: a loop can have bugs too. The number can be wrong, or one tile inside the loop.
    Watch Fox, find the wrong tile and fix it!
  demo: Count the steps Fox needs. If the number on the Repeat is wrong, that is the bug!
turn-facing:
  title: Which way am I facing?
  story: >-
    Owl says: a turn spins Fox around on the spot. Fox keeps facing that way until the next
    turn. Left and right are Fox's own left and right — look where Fox is facing!
  demo: Fox faces up. Turn right, and Fox faces right. Turn right again, and Fox faces down.
turn-build:
  title: Forward and turn
  story: >-
    Owl says: now Fox walks like you do. Forward goes the way Fox faces. Turn left or turn
    right to face a new way!
  demo: Fox faces up. Forward, forward, turn right, forward. Up, up, then right!
turn-loop:
  title: Turns in loops
  story: >-
    Owl says: Repeat works with turns too! Repeat forward and turn right, and Fox walks round
    in a square. Count the sides, and that is the number!
  demo: Forward, turn right, again and again. Fox draws a square!
turn-jump:
  title: Jump the gap
  story: >-
    Owl says: a wall of rocks blocks the way! Jump goes two squares in one move, over one rock.
    Fox lands on the second square.
  demo: Jump goes two squares. Fox flies over the rock and does not touch it!
turn-debug:
  title: Mirror bugs
  story: >-
    Owl says: left and right can get mixed up! Watch Fox, find the tile that sends Fox the
    wrong way and fix it. A turn where Fox should walk is a bug too.
  demo: Turn left instead of turn right? Fox goes the wrong way. Swap the tile and Fox is fine!
ask-order: Put the pictures in order.
ask-order-guided: Put the pictures in order. Tap the first step first.
