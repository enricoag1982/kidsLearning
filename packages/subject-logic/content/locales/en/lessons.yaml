    colour-orange: They are all orange.
    kind-circle: They are all circles.
    kind-square: They are all squares.
    kind-triangle: They are all triangles.
    kind-star: They are all stars.
    kind-heart: They are all hearts.
    kind-diamond: They are all diamonds.
    size-tiny: They are all tiny.
    size-medium: They are all medium.
    size-huge: They are all huge.
  # W3 (m14.11): the sudoku sentences.
  sdk-guided: Which number goes in the ringed cell?
  sdk-last: Fill the grid. Look for a row, column or box with one empty cell.
  sdk-place: Fill the grid. For each number, find the only place it can go in a box.
  sdk-number: Fill the grid. For each empty cell, find the only number left.
  sdk-six: 'Fill the big grid: each row, column and box has 1 to 6 once.'
# The authored "taller than" items of cls-line-up (`lu-*`): each clue is a sentence, the answer needs both.
lu-tallest: The bear is taller than the fox. The fox is taller than the rabbit. Who is the tallest?
lu-shortest: The giraffe is taller than the horse. The horse is taller than the dog. Who is the shortest?
lu-order: The cat is bigger than the mouse. The dog is bigger than the cat. Put them in order, smallest first.
lu-true: 'The owl is taller than the hen. The hen is taller than the chick. True or false: the chick is taller than the owl.'
