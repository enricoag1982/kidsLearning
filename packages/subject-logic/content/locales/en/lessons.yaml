# Lesson and mini-game texts: `<id>.title`, `<id>.story`, `<id>.demo` for a lesson, `<id>.title` / `<id>.goal` for a mini-game. Every
# exercise sentence is generated from `templates.*` below (`lessons:gen.<id>.text`), and every reason from `bugs.*`.
pat-repeat:
  title: Repeat
  story: >-
    Pip loves patterns. A pattern has a part that repeats, again and again.
    Find the part that repeats, then say what comes next!
  demo: Red circle, blue square, again and again. Next comes a blue square.
pat-steps:
  title: Number steps
  story: >-
    Numbers can make patterns too. Look at the jump from one number to the next.
    Check every jump, not just the first one!
  demo: Every jump is plus 4. 15 plus 4 is 19.
pat-grow:
  title: Growing
  story: >-
    Some patterns grow. Count how many more there are each time.
    The next picture has that many more again.
  demo: Each step has 2 more stars. 5 and 2 more make 7.
pat-far:
  title: Far ahead
  story: >-
    Pip wants to know what comes much later. Count in whole parts that repeat, like red, blue.
    Red is always first in each part.
  demo: 'Count in twos: numbers 2, 4, 6, 8 and 10 are all blue. Number 10 is blue.'
pattern-train:
  title: Pattern Train
  goal: Every carriage follows the pattern. Which one comes next?
cls-odd:
  title: Odd one out
  story: >-
    Pip found shells on the shore. They are all alike, except one!
    Check the colour, the shape, the size and how many.
  demo: Three are circles. The square is the odd one out.
cls-rule:
  title: Find the rule
  story: >-
    Now Pip asks: what do they all share?
    Check one thing at a time: colour, then shape, then size.
  demo: Different shapes, different sizes, but all red. They are all red!
cls-boxes:
  title: Two boxes
  story: >-
    Pip sorts the shells into boxes. Each box has a rule.
    Check the card against the rule, then put it in.
  demo: 'Is it red? Yes. Is it a circle? Yes. It goes where red meets circle.'
cls-circles:
  title: Circles
  story: >-
    Two circles, two rules. A card that fits both goes in the middle, where the circles meet.
    A card that fits neither stays outside.
  demo: 'Blue? Yes. A circle? No. It goes in the blue circle only.'
cls-line-up:
  title: Line up
  story: >-
    Pip lines the shells up from smallest to biggest. Compare two at a time.
    If the bear is taller than the fox, and the fox is taller than the rabbit, then the bear is taller than the rabbit!
  demo: 'Smallest first: tiny, then medium, then huge.'
sorting-sprint:
  title: Sorting Sprint
  goal: Help Pip sort the shells!
grd-last:
  title: Last empty cell
  story: >-
    Pip has a number grid. The rule: each row, column and box has every number once.
    If only one cell is empty, which number is missing?
  demo: This row has 1, 2 and 4. The missing number is 3.
grd-only-place:
  title: Only place
  story: >-
    Sometimes a number fits in only one place. Pick a box and a number.
    Cross out every cell that already sees that number. One cell is left!
  demo: The 3s in these rows block two cells. Only one cell in the box can take the 3.
grd-only-number:
  title: Only number
  story: >-
    Now pick one empty cell. Which numbers are already in its row, its column and its box?
    Cross them out. The number left is the answer.
  demo: Its row has 1, its column has 2 and 4. Only 3 is left.
grd-six:
  title: Six by six
  story: >-
    A bigger grid! Six numbers, and each box has two rows of three.
    The same tricks still work.
  demo: This box already has 1, 2, 4, 5 and 6. The empty cell gets 3.
grd-pixels:
  title: Picture cross
  story: >-
    Picture cross! The numbers say how many cells in a line are filled, in groups.
    Fill the cells you are sure of, cross out the empty ones, and a picture appears.
  demo: 'A 5 in a row of five: fill them all. A 0: cross them all out.'
sudoku-sprint:
  title: Sudoku Sprint
  goal: Fill the grids, step by step!
# The misconception reasons (docs/subjects/logic/curriculum.md §3): the one sentence spoken when the wrong answer matches.
bugs:
  unit-break: Say the pattern from the start. Which part repeats?
  first-jump: Check every jump, not just the first one.
  grow-off: Look how many more there are each time.
  far-off: Count in whole parts, not one by one.
# The instruction of every generated item (`lessons:gen.<id>.text`) and the rule cards of `step-rule`.
templates:
  pat-next: What comes next?
  pat-gap: What is missing?
  step-next: What number comes next?
  step-rule: Which rule makes these numbers?
  grow-next-choice: Which picture comes next?
  grow-next-entry: How many in step {{n}}?
  far-term: Which shape is number {{n}}?
  rule-step: '+{{d}} each time'
  rule-double: × 2 each time
  rule-alt: '+{{a}}, then +{{b}}, again and again'
  rule-grow: '+{{a}}, +{{b}}, +{{c}} …'
  odd-one: Which one is different?
  odd-rule: What is the same about all of them?
  sort-boxes: Put each card in its box.
  carroll: Look at both rules. Where does each card go?
  venn: Where does each card go? The middle fits both.
  line-up-size: Put them in order, smallest first.
  line-up-count: Put them in order, fewest first.
