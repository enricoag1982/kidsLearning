# The few app texts every subject supplies; the rest come from the platform. `Logic` is the display name.
app:
  title: Logic
home:
  owl-next: 'Today you meet {{character}}!'
den:
  owl-line: Look at all your friends!
  friends-heading: Your friends
  friend-name: '{{character}}, friend'
  friend-name-locked: '{{character}}, locked, finish the {{piece}} lesson'
  friend-condition: 'Finish the {{piece}} lesson'
session:
  summary-new-friend: New friend!
voice-check:
  sentence: Let's try Logic together!
time-limit:
  early-body: 'Logic opens at {{time}}. See you soon!'
placement:
  offer-question: Already know some of this? Let's find out where to start you!
  summary-none-body: Every star starts with the first step.
# What a lesson character teaches (`topicKey` in src/core.ts), shown in My Den and on the Journey.
topic:
  puzzle: Puzzle
# Grid puzzles (kind `grid-fill`): the instruction under each puzzle and what the Owl says about it. Worded by technique only: no numbers
# and no coordinates (docs/subjects/logic/plan.md L6).
grid:
  instruction:
    sudoku: 'Fill the grid: each row, column and box has every number once.'
    cross: Fill the cells to match the clues. Find the picture!
  wrong:
    row: That number is already in this row.
    column: That number is already in this column.
    box: That number is already in this box.
    plain: Not yet. Which numbers can still go here?
    cross-row: That does not match this row's clue.
    cross-column: That does not match this column's clue.
    cross-plain: Not this one. Check the clues again.
  hint:
    look-row: Look at this row.
    look-column: Look at this column.
    look-box: Look at this box.
    look-cell: Look at this cell and the row, column and box around it.
    look-line-row: Look at this row and its clue.
    look-line-column: Look at this column and its clue.
    last-cell: Only one cell is empty here. Which number is missing?
    hidden-single: Only one cell here can take the number. Find it!
    naked-single: This cell has only one number left. Cross out the others.
    full-line: This clue fills the whole line.
    overlap: 'The run is long: the middle cells are filled wherever it starts.'
    cross-out: This line has all its filled cells. Cross out the rest.
    combine: Use the fills and crosses from the other lines.
    show: 'Watch: here it goes.'
