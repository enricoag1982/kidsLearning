# One main track with one world. Add worlds (`order: 2`, a new `habitat`) and `branch` tracks as the subject grows.
# `title` / habitat names are texts in locales/en/journey.yaml.
tracks:
  - id: basics
    kind: main
    title: tracks.basics
    worlds:
      - { id: first-steps, order: 1, habitat: meadow, title: worlds.first-steps, boss: sample-boss }
# A rank is earned `after` a world (`world:<id>`) or at the `start`; its name is in locales/en/journey.yaml.
ranks:
  - { id: starter, after: start }
  - { id: explorer, after: world:first-steps }
