# One main track, "Puzzle Paths": World 1 Pattern Pond (patterns, Pattern Train), World 2 Sort Shore (sorting, Sorting Sprint) and
# World 3 Grid Puzzles (sudoku and picture cross, Sudoku Sprint) (`boss`: a mini-game of the world, opened by its last lesson; the
# world counts as mastered once its lessons are mastered and the boss is won). `title` and the world's name are texts in
# locales/en/journey.yaml.
tracks:
  - id: puzzles
    kind: main
    title: tracks.puzzles
    worlds:
      - {
          id: pattern-pond,
          order: 1,
          habitat: river,
          title: worlds.pattern-pond,
          boss: pattern-train,
        }
      - { id: sort-shore, order: 2, habitat: ocean, title: worlds.sort-shore, boss: sorting-sprint }
      - {
          id: grid-puzzles,
          order: 3,
          habitat: jungle,
          title: worlds.grid-puzzles,
          boss: sudoku-sprint,
        }
# A rank is earned `after` a world (`world:<id>`) or at the `start`; its name is in locales/en/journey.yaml.
ranks:
  - { id: thinker, after: start }
  - { id: spotter, after: world:pattern-pond }
  - { id: sorter, after: world:sort-shore }
  - { id: solver, after: world:grid-puzzles }
