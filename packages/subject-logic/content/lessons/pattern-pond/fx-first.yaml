# The fixture lesson (m14.5): proves the card pipeline for logic (2 guided tries and 3 scored exercises of `choice` / `order` cards
# with emoji, no boss); m14.9 replaces it with the real Pattern Pond lessons.
id: fx-first
order: 1
concept: fx-first
character: panda
demo:
  prompt: { emoji: 🐸🐟🐸🐟🐸🐟 }
guided:
  - id: fx-g1
    type: choice
    prompt: { emoji: 🐸🐟🐸🐟🐸 }
    options:
      - { id: frog, emoji: 🐸 }
      - { id: fish, emoji: 🐟 }
    answer: fish
  - id: fx-g2
    type: order
    items:
      - { id: two, emoji: 🐟🐟 }
      - { id: three, emoji: 🐟🐟🐟 }
      - { id: one, emoji: 🐟 }
    answer: [one, two, three]
exercises:
  - id: fx-01
    type: choice
    prompt: { emoji: 🐸🐸🐟🐸🐸🐟🐸🐸 }
    options:
      - { id: frog, emoji: 🐸 }
      - { id: fish, emoji: 🐟 }
    answer: fish
  - id: fx-02
    type: order
    items:
      - { id: three, emoji: 🐸🐸🐸 }
      - { id: one, emoji: 🐸 }
      - { id: four, emoji: 🐸🐸🐸🐸 }
      - { id: two, emoji: 🐸🐸 }
    answer: [one, two, three, four]
  - id: fx-03
    type: choice
    prompt: { emoji: 🐸🐟🦆🐸🐟🦆🐸🐟 }
    options:
      - { id: frog, emoji: 🐸 }
      - { id: fish, emoji: 🐟 }
      - { id: duck, emoji: 🦆 }
    answer: duck
