# W2 lesson 1: odd one out. Four or three cards are alike but one: check the colour, the shape, the size and how many. Generated; seeds
# are stored, never change them. The demo is the worked example: three blue circles and a blue square.
id: cls-odd
order: 1
concept: cls-odd
character: panda
demo:
  prompt:
    shapes:
      - { kind: circle, colour: blue }
      - { kind: circle, colour: blue }
      - { kind: circle, colour: blue }
      - { kind: square, colour: blue }
guided:
  - id: odd-g-colour
    generate: { template: odd-one, count: 1, seed: 7, params: { attr: colour, items: 3 } }
  - id: odd-g-kind
    generate: { template: odd-one, count: 1, seed: 2, params: { attr: kind, items: 3 } }
exercises:
