# A lesson: a story, a demo, `guided` tries (the first help-first taps), scored `exercises` and `variants` (easier versions,
# one per exercise that names it in `easier`). Question texts live in locales/en/lessons.yaml under the exercise `id`.
id: sample-lesson-1
order: 1
concept: sample-one
character: panda
demo:
  prompt: { emoji: 🍎🍎🍎, big: 3 }
guided:
  - id: s1-g1
    type: choice
    prompt: { emoji: 🍎🍎 }
    options:
      - { id: a, big: 2 }
      - { id: b, big: 3 }
    answer: a
  - id: s1-g2
    type: true-false
    prompt: { emoji: 🍎🍎🍎 }
    answer: true
exercises:
  - id: s1-01
    type: choice
    prompt: { emoji: 🍎🍎🍎🍎 }
    options:
      - { id: a, big: 3 }
      - { id: b, big: 4 }
      - { id: c, big: 5 }
    answer: b
    easier: s1-01-easy
  - id: s1-02
    type: true-false
    prompt: { big: 2 + 2 = 5 }
    answer: false
  - id: s1-03
    type: number-entry
    prompt: { big: 4 + 3 }
    answer: 7
  - id: s1-04
    type: order
    prompt: { emoji: 🔢 }
    items:
      - { id: three, big: 3 }
      - { id: one, big: 1 }
      - { id: two, big: 2 }
    answer: [one, two, three]
  - id: s1-05
    type: choice
    options:
      - { id: cat, emoji: 🐱, text: s1-05-cat }
      - { id: dog, emoji: 🐶, text: s1-05-dog }
      - { id: fish, emoji: 🐟, text: s1-05-fish }
    answer: cat
variants:
  - id: s1-01-easy
    type: choice
    prompt: { emoji: 🍎🍎 }
    options:
      - { id: a, big: 2 }
      - { id: b, big: 3 }
    answer: a
