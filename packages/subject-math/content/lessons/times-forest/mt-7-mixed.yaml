# W3 lesson 6: the 7 times table, the tricks for 0 and 1, then every table mixed. Generated; seeds are stored, never change them.
# `t7-zero` is a times-1 fact (the guided one is times 0). `t7-hard` is the hardest item (7 times a big number); its easier variant is
# a times-7 fact up to 5. The last two items mix all the tables (2 to 10).
id: mt-7-mixed
order: 6
concept: mt-7-mixed
character: hedgehog
demo:
  prompt: { big: '7 × 6' }
guided:
  - id: t7-g7
    generate: { template: fact, count: 1, seed: 1, params: { tables: [7], b: [3, 9] } }
  - id: t7-g01
    generate: { template: fact, count: 1, seed: 7, params: { tables: [0, 1], b: [3, 9] } }
exercises:
