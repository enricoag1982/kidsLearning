# One main track, "Number Adventures": World 1 Number Meadow (place value) ending in the Number Train world boss, World 2 Mental Math
# Mountain (mental strategies) ending in Market Orders (`boss`: a mini-game of the world, opened by its last lesson; the world counts
# as mastered once its lessons are mastered and the boss is won). World 3 joins in m13.14. `title` and the world's name are texts in
# locales/en/journey.yaml.
tracks:
  - id: numbers
    kind: main
    title: tracks.numbers
    worlds:
      - {
          id: number-meadow,
          order: 1,
          habitat: meadow,
          title: worlds.number-meadow,
          boss: number-train,
        }
      - {
          id: mental-mountain,
          order: 2,
          habitat: mountains,
          title: worlds.mental-mountain,
          boss: market-orders,
        }
# A rank is earned `after` a world (`world:<id>`) or at the `start`; its name is in locales/en/journey.yaml.
ranks:
  - { id: counter, after: start }
  - { id: builder, after: world:number-meadow }
  - { id: climber, after: world:mental-mountain }
