# Generic conditions only; name / condition texts live in locales/en/rewards.yaml under `badges.<id>.name` / `.condition`.
badges:
  - id: number-builder
    category: milestone
    condition: { type: mastered, scope: 'world:number-meadow', thresholds: [1] }
  - id: star-counter
    category: skill
    condition: { type: stars-total, thresholds: [10, 30] }
