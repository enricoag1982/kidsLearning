# Lesson and mini-game texts: `<id>.title`, `<id>.story`, `<id>.demo` for a lesson, `<id>.title` / `<id>.goal` for a mini-game. Every
# exercise sentence is generated from `templates.*` below (`lessons:gen.<id>.text`), and every reason from `bugs.*`; `race.*` are the
# Race to 20 board lines.
pv-hto:
  title: Hundreds, tens, ones
  story: >-
    Owl says: every digit has a place. Hedgie counts the hundreds, then the tens, then the ones.
    An empty place still needs a zero!
  demo: 'Look: 2 hundreds, 0 tens and 5 ones. The zero holds the tens place, so the number is 205!'
pv-compare:
  title: Bigger or smaller?
  story: >-
    Owl says: look at the biggest place first. Hedgie checks the hundreds, then the tens.
    The open side of the sign faces the bigger number!
  demo: >-
    Compare 406 and 460. The hundreds are the same, so look at the tens.
    0 tens is less than 6 tens, so 406 is smaller!
pv-line:
  title: The number line
  story: >-
    Owl says: a number line is a path of numbers. Every jump is the same size.
    Hedgie counts the jumps, not the marks!
  demo: >-
    This line goes from 0 to 1000, with a mark every 100.
    To find 300, Hedgie counts three jumps from 0!
pv-thousands:
  title: Thousands
  story: >-
    Owl says: ten hundreds make one thousand. The thousands get a place on the left.
    Hedgie reads thousands, hundreds, tens, then ones!
  demo: >-
    Look: 3 thousands, 4 hundreds, 0 tens and 5 ones.
    The zero keeps the tens place, so the number is 3405!
pv-round:
  title: Rounding
  story: >-
    Owl says: rounding finds the nearest ten or hundred. Hedgie checks the next digit:
    5 or more goes up, less than 5 stays down.
  demo: >-
    Round 47 to the nearest ten. The ones digit is 7, so go up.
    47 is closer to 50 than to 40!
number-train:
  title: Number Train
  goal: Put every carriage number where it belongs on the line!
bugs:
  append: 'Each place holds one digit: 2 hundreds is 200, not 2000.'
  swap: 'Look at the order: hundreds, then tens, then ones.'
  drop-zero: An empty place still needs a zero to hold its spot.
  ones-first: Compare the biggest place first.
  ticks-not-gaps: Count the jumps between the marks, not the marks.
  truncate: Rounding down every time? Check which number is nearer.
  five-down: Right in the middle? It goes up to the bigger number.
  # W2 (m13.11)
  digit-tens: The tens make 90, then the ones make 10 more.
  tens-only: Double the tens and the ones.
  halve-tens-only: Halve the tens and the ones.
  off-by-one: So close! Count the last jump again.
  off-by-ten: Check the tens.
  wrong-place: Ten changes the tens digit. A hundred changes the hundreds digit.
  forgot-adjust: You used the round number. Now fix the answer by 1.
  answer-next: The equals sign means both sides are the same.
  wrong-op: 'Read it again: does the number get bigger or smaller?'
templates:
  pv-build: Build {{n}} with blocks.
  pv-read: '{{h}} hundreds, {{t}} tens and {{o}} ones. What number is it?'
  pv-read-4: '{{th}} thousands, {{h}} hundreds, {{t}} tens and {{o}} ones. What number is it?'
  pv-which: Which number has {{h}} hundreds, {{t}} tens and {{o}} ones?
  pv-which-4: Which number has {{th}} thousands, {{h}} hundreds, {{t}} tens and {{o}} ones?
  pv-expanded: Put the parts together. What number is it?
  cmp-sign: Which sign goes in the gap? The open side faces the bigger number.
  cmp-order: Put the numbers in order, smallest first.
  cmp-tf: Is this true?
  nl-place: Put {{n}} on the number line.
  nl-estimate: About where is {{n}}? Put it on the line.
  nl-half: What number is halfway between {{a}} and {{b}}?
  round-ten: Round {{n}} to the nearest ten.
  round-hundred: Round {{n}} to the nearest hundred.
  round-tf: Is this the nearest {{unit}}?
  # W2 (m13.11)
  bond-missing: What number makes {{total}}?
  bond-pairs: Which two numbers make {{total}}?
  double: Double {{n}}.
  near-double: Use a double to help. What is the total?
  halve: What is half of {{n}}?
  bridge-add: Make a ten first. What is the total?
  count-up: Count up from the smaller number. How many?
  tens-hundreds: What is the answer?
  compensate-add: Add {{round}}, then take 1 away. What is it?
  compensate-take: Take away {{round}}, then add 1 back. What is it?
  equals-balance: Both sides must be the same. What goes in the gap?
stories:
  part-whole-1: Fox has {{a}} red berries and {{b}} blue berries. How many berries in all?
  part-whole-2: Bear sold {{a}} loaves in the morning and {{b}} in the afternoon. How many loaves did Bear sell?
  part-whole-3: Rabbit picked {{a}} carrots and Cat picked {{b}} carrots. How many carrots did they pick together?
  part-whole-4: Panda has {{a}} bamboo sticks in one pile and {{b}} in another. How many sticks are in both piles?
  change-add-1: Penguin had {{a}} fish. Then Penguin caught {{b}} more. How many fish does Penguin have now?
  change-add-2: Frog has {{a}} stickers. A friend gives Frog {{b}} more. How many stickers does Frog have now?
  change-add-3: Elephant had {{a}} peanuts in a bag. Elephant puts in {{b}} more. How many peanuts are in the bag now?
  change-add-4: Cat has {{a}} coins. Cat finds {{b}} more coins. How many coins does Cat have now?
  change-take-1: Rabbit had {{a}} carrots. Rabbit ate {{b}} of them. How many carrots are left?
  change-take-2: Fox has {{a}} marbles and gives {{b}} to Bear. How many marbles does Fox have left?
  change-take-3: Panda baked {{a}} buns and sold {{b}} of them. How many buns are left?
  change-take-4: Frog had {{a}} stamps and used {{b}} of them on letters. How many stamps are left?
  compare-1: Elephant has {{a}} peanuts. Penguin has {{b}} peanuts. How many more peanuts does Elephant have than Penguin?
  compare-2: Cat has {{b}} stickers. Bear has {{a}} stickers. How many more stickers does Bear have than Cat?
  compare-3: Fox found {{a}} shells. Frog found {{b}} shells. How many more shells did Fox find than Frog?
  compare-4: Panda has {{b}} marbles. Rabbit has {{a}} marbles. How many more marbles does Rabbit have than Panda?
race-to-20:
  title: Race to 20
  goal: Take turns adding 1, 2 or 3. Whoever says 20 wins!
race:
  hint: Try to land on 4, 8, 12 or 16.
  bot-adds: "{{bot}} adds {{step}}. Now it's {{total}}."
  you-add: "You add {{step}}. Now it's {{total}}."
  your-turn: Your turn!
  total-label: 'Total {{total}} of {{target}}'
