app:
  title: Math
home:
  owl-next: 'Today you meet {{character}}!'
den:
  owl-line: Look at all your friends!
  friends-heading: Your friends
  friend-name: '{{character}}, friend'
  friend-name-locked: '{{character}}, locked, finish the {{piece}} lesson'
  friend-condition: 'Finish the {{piece}} lesson'
session:
  summary-new-friend: New friend!
voice-check:
  sentence: Let's do some math together!
time-limit:
  early-body: 'Math opens at {{time}}. See you soon!'
placement:
  offer-question: Already know some math? Let's find out where to start you!
  summary-none-body: Every math whiz starts with the first step.
topic:
  counter: Counter
math:
  # The number line kind (src/kinds/number-line): the name a screen reader reads, the notes under the question and the hints.
  # The place-value kind (src/kinds/place-value): its notes, hints and the names a screen reader reads (`pv`); `{{place}}` is one of the
  # `pv.name` (a column), `pv.plural` (a sentence) or `pv.one` (a button) texts.
  line:
    label: 'Number line from {{from}} to {{to}}, a mark every {{step}}'
    marker-at: 'Marker at {{value}}'
    no-marker: No marker yet
  notes:
    line-wrong: Not there yet. Look at the numbers on the line.
    pv-wrong: Count the blocks in each column again.
    array-wrong: Count the rows and the dots in each row.
    array-swapped: Same number, but count the rows again.
  hints:
    line-benchmark: 'Find the middle: {{benchmark}}.'
    line-labels: Read the numbers on every mark.
    array-rows: Rows go across, like lines in a book.
    array-row-total: 'Each row has {{cols}}.'
    pv-columns: 'Hundreds, tens and ones: count each column.'
    pv-numeral: The number beside the blocks shows what you built.
    pv-fill: 'Here are the {{place}}. Now finish!'
  pv:
    short:
      thousands: Th
      hundreds: H
      tens: T
      ones: O
    name:
      thousands: Thousands
      hundreds: Hundreds
      tens: Tens
      ones: Ones
    group: '{{place}}: {{count}}'
    numeral: 'Your number: {{value}}'
    plural:
      thousands: thousands
      hundreds: hundreds
      tens: tens
      ones: ones
    one:
      thousands: thousand
      hundreds: hundred
      tens: ten
      ones: one
    add: 'Add a {{place}}'
    remove: 'Take away a {{place}}'
